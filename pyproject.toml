[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-llm"
version = "0.1.0"
description = "Cliente LLM asíncrono unificado para OpenAI y Anthropic"
requires-python = ">=3.12"
dependencies = [
    "openai==3.45.0",
    "anthropic==2.4.0",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "langchain-core==1.8.0",
    "langchain-openai==1.7.4",
    "chromadb==1.5.9",
    "langchain-chroma==1.1.0",
    "langchain-text-splitters==1.1.3",
    "tiktoken==0.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
